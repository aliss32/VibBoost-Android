name: Android CI - VibBoost APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Executable
      run: chmod +x gradlew || (gradle wrapper --gradle-version 8.5 && chmod +x gradlew)

    - name: Clean and Build
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode all

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VibBoost-v1-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
